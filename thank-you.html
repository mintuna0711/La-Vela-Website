
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | La Vela</title>

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap"
        rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #fff;
      background-color: #14251d;

      /* Thay thankyou-bg.jpg bằng tên ảnh nền của cậu */
      background-image:
        linear-gradient(
          rgba(10, 20, 15, 0.38),
          rgba(10, 20, 15, 0.55)
        ),
        url("meme mèo.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .thank-you-content {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 38px;
      color: #e0c38c;
    }

    h1 {
      font-family: 'Bodoni Moda', serif;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .japanese {
      font-size: clamp(23px, 4vw, 36px);
      letter-spacing: 5px;
      margin-bottom: 24px;
    }

    .message {
      font-size: 14px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.5px;
      margin-bottom: 35px;
    }

    .back-home {
      display: inline-block;
      color: #fff;
      border: 1px solid #d8bd83;
      padding: 13px 28px;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .back-home:hover {
      background: #d8bd83;
      color: #14251d;
    }

    @media (max-width: 600px) {
      .brand {
        letter-spacing: 3px;
      }

      .message {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="thank-you-content">
    <p class="brand">LA VELA SAIGON HOTEL</p>

    <h1>Thank You</h1>

    <p class="japanese">ari-ga-to go-sai-ma-sư</p>

    <p class="message">
      Cảm ơn bạn đã lựa chọn La Vela Christmas Cake Collection.<br>
      Chúng tôi trân trọng từng khoảnh khắc ngọt ngào của bạn.
    </p>

    <a href="index.html" class="back-home">
      BACK TO HOME
    </a>
  </main>
</body>
</html>
